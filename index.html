<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローレン・イロアス 방송 스케줄</title>
<style>
body{font-family:sans-serif;background:#dfe5f0;margin:0;padding:12px;color:#334}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{border:0;border-radius:16px;padding:8px 14px;background:#7188b5;color:#fff;font-size:14px}
.day{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.day b{display:block;margin-bottom:4px}
.ev{display:flex;gap:8px;background:#eef1f8;border-left:4px solid #7188b5;border-radius:6px;padding:6px 8px;margin-top:4px;font-size:14px;color:inherit;text-decoration:none}
.ev img{width:80px;height:45px;object-fit:cover;border-radius:4px;flex:none}
.ev small{color:#789}
.sum{font-size:13px;margin-bottom:8px}
.tag{background:#d9534f;color:#fff;border-radius:8px;padding:0 6px;font-size:11px;margin-right:4px}
</style>
</head>
<body>
<h1>ローレン・イロアス 방송 스케줄</h1>
<div class="bar">
<button onclick="move(-7)">←</button>
<span id="range"></span>
<button onclick="move(7)">→</button>
</div>
<div class="sum" id="sum"></div>
<div id="cal">불러오는 중...</div>
<script>
let events=[];
let base=new Date();
base.setHours(0,0,0,0);
base.setDate(base.getDate()-((base.getDay()+6)%7));
const names=["월","화","수","목","금","토","일"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function move(n){base.setDate(base.getDate()+n);draw();}
function draw(){
 const cal=document.getElementById("cal");
 cal.innerHTML="";
 let total=0;
 for(let i=0;i<7;i++){
  const d=new Date(base);d.setDate(d.getDate()+i);
  const box=document.createElement("div");box.className="day";
  const h=document.createElement("b");
  h.textContent=(d.getMonth()+1)+"/"+d.getDate()+" ("+names[i]+")";
  box.appendChild(h);
  const list=events.filter(e=>key(new Date(e.start))===key(d));
  if(!list.length){
   const s=document.createElement("small");
   s.textContent="방송 없음";
   box.appendChild(s);
  }
  list.forEach(e=>{
   total+=e.hours||0;
   const a=document.createElement("a");
   a.className="ev";
   a.href="https://www.youtube.com/watch?v="+e.id;
   a.target="_blank";a.rel="noopener";
   if(e.thumb){const im=document.createElement("img");im.src=e.thumb;im.alt="";a.appendChild(im);}
   const t=document.createElement("div");
   const st=new Date(e.start);
   if(e.status==="upcoming"||e.status==="live"){
    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent=e.status==="live"?"LIVE":"예정";
    t.appendChild(tag);
   }
   t.appendChild(document.createTextNode(pad(st.getHours())+":"+pad(st.getMinutes())+" "+e.title));
   t.appendChild(document.createElement("br"));
   const sm=document.createElement("small");
   sm.textContent=e.hours?e.hours+"시간":"";
   t.appendChild(sm);
   a.appendChild(t);
   box.appendChild(a);
  });
  cal.appendChild(box);
 }
 const end=new Date(base);end.setDate(end.getDate()+6);
 document.getElementById("range").textContent=(base.getMonth()+1)+"/"+base.getDate()+" - "+(end.getMonth()+1)+"/"+end.getDate();
 document.getElementById("sum").textContent="이번 주 합계: "+Math.round(total*10)/10+"시간";
}
fetch("data.json?"+Date.now())
 .then(r=>r.json())
 .then(d=>{events=d;draw();})
 .catch(()=>{document.getElementById("cal").textContent="data.json을 불러오지 못했어요";});
</script>
</body>
</html>

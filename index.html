<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローレン・イロアス 방송 스케줄</title>
<style>
body{font-family:sans-serif;background:#f3e0e0;margin:0;padding:12px;color:#3a2326}
h1{font-size:18px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tabs button{margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{border:0;border-radius:16px;padding:8px 14px;background:#b3263b;color:#fff;font-size:14px}
button.off{background:#e0b5bb}
.day{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.day b{display:block;margin-bottom:4px}
.ev{display:flex;gap:8px;background:#fbeeee;border-left:4px solid #b3263b;border-radius:6px;padding:6px 8px;margin-top:4px;font-size:14px;color:inherit;text-decoration:none}
.ev img{width:80px;height:45px;object-fit:cover;border-radius:4px;flex:none}
.ev small{color:#a07077}
.sum{font-size:13px;margin-bottom:8px}
.tag{background:#3a2326;color:#fff;border-radius:8px;padding:0 6px;font-size:11px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.nm{text-align:center;font-size:12px;color:#a07077}
.cell{position:relative;aspect-ratio:1/1.25;background:#fff;border-radius:6px;overflow:hidden}
.cell.out{opacity:.35}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .n{position:absolute;left:3px;bottom:1px;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.cell .n.plain{color:#c4a0a5;text-shadow:none}
.cell .h{position:absolute;left:3px;top:2px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 4px}
</style>
</head>
<body>
<div class="top">
<h1>ローレン・イロアス 방송 스케줄</h1>
<div class="tabs">
<button id="tw" onclick="setMode('week')">주</button><button id="tm" class="off" onclick="setMode('month')">월</button>
</div>
</div>
<div class="bar">
<button onclick="move(-1)">←</button>
<span id="range"></span>
<button onclick="move(1)">→</button>
</div>
<div class="sum" id="sum"></div>
<div id="cal">불러오는 중...</div>
<script>
let events=[],byDay={};
let mode="week";
let ref=new Date();ref.setHours(0,0,0,0);
const names=["월","화","수","목","금","토","일"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hrs=list=>list.reduce((s,e)=>s+(e.hours||0),0);
const r1=x=>Math.round(x*10)/10;
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function build(){
 byDay={};
 events.forEach(e=>{const k=key(new Date(e.start));(byDay[k]=byDay[k]||[]).push(e);});
}
function setMode(m){
 mode=m;
 document.getElementById("tw").className=m==="week"?"":"off";
 document.getElementById("tm").className=m==="month"?"":"off";
 draw();
}
function move(n){
 if(mode==="week"){ref.setDate(ref.getDate()+7*n);}
 else{ref.setDate(1);ref.setMonth(ref.getMonth()+n);}
 draw();
}
function draw(){mode==="week"?drawWeek():drawMonth();}
function drawWeek(){
 const cal=document.getElementById("cal");
 cal.innerHTML="";
 const base=monday(ref);
 let total=0;
 for(let i=0;i<7;i++){
  const d=new Date(base);d.setDate(d.getDate()+i);
  const box=document.createElement("div");box.className="day";
  const h=document.createElement("b");
  h.textContent=(d.getMonth()+1)+"/"+d.getDate()+" ("+names[i]+")";
  box.appendChild(h);
  const list=byDay[key(d)]||[];
  if(!list.length){
   const s=document.createElement("small");
   s.textContent="방송 없음";
   box.appendChild(s);
  }
  list.forEach(e=>{
   total+=e.hours||0;
   const a=document.createElement("a");
   a.className="ev";
   a.href="https://www.youtube.com/watch?v="+e.id;
   a.target="_blank";a.rel="noopener";
   if(e.thumb){const im=document.createElement("img");im.src=e.thumb;im.alt="";a.appendChild(im);}
   const t=document.createElement("div");
   const st=new Date(e.start);
   if(e.status==="upcoming"||e.status==="live"){
    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent=e.status==="live"?"LIVE":"예정";
    t.appendChild(tag);
   }
   t.appendChild(document.createTextNode(pad(st.getHours())+":"+pad(st.getMinutes())+" "+e.title));
   t.appendChild(document.createElement("br"));
   const sm=document.createElement("small");
   sm.textContent=e.hours?e.hours+"시간":"";
   t.appendChild(sm);
   a.appendChild(t);
   box.appendChild(a);
  });
  cal.appendChild(box);
 }
 const end=new Date(base);end.setDate(end.getDate()+6);
 document.getElementById("range").textContent=(base.getMonth()+1)+"/"+base.getDate()+" - "+(end.getMonth()+1)+"/"+end.getDate();
 document.getElementById("sum").textContent="이번 주 합계: "+r1(total)+"시간";
}
function drawMonth(){
 const cal=document.getElementById("cal");
 cal.innerHTML="";
 const y=ref.getFullYear(),m=ref.getMonth();
 const grid=document.createElement("div");grid.className="grid";
 names.forEach(n=>{const h=document.createElement("div");h.className="nm";h.textContent=n;grid.appendChild(h);});
 const d=monday(new Date(y,m,1));
 const last=new Date(y,m+1,0);
 let total=0,count=0;
 while(d<=last||d.getDay()!==1){
  const list=byDay[key(d)]||[];
  const inMonth=d.getMonth()===m;
  const cell=document.createElement("div");
  cell.className="cell"+(inMonth?"":" out");
  const dd=new Date(d);
  cell.onclick=()=>{ref=dd;setMode("week");};
  if(list.length&&list[0].thumb){
   const im=document.createElement("img");im.src=list[0].thumb;im.alt="";cell.appendChild(im);
  }
  if(list.length){
   const hb=document.createElement("span");
   hb.className="h";hb.textContent=r1(hrs(list))+"h";
   cell.appendChild(hb);
  }
  const n=document.createElement("span");
  n.className="n"+(list.length?"":" plain");
  n.textContent=pad(d.getDate());
  cell.appendChild(n);
  if(inMonth){total+=hrs(list);count+=list.length;}
  grid.appendChild(cell);
  d.setDate(d.getDate()+1);
 }
 cal.appendChild(grid);
 document.getElementById("range").textContent=y+"년 "+(m+1)+"월";
 document.getElementById("sum").textContent=count+"회 방송 · 합계 "+r1(total)+"시간";
}
fetch("data.json?"+Date.now())
 .then(r=>r.json())
 .then(d=>{events=d;build();draw();})
 .catch(()=>{document.getElementById("cal").textContent="data.json을 불러오지 못했어요";});
</script>
</body>
</html>

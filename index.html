<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローレン・イロアス 방송 스케줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Zen Maru Gothic","Noto Sans KR",sans-serif;color:#3a2326;background-color:#f8ecec;background-image:linear-gradient(#efd9dc 1px,transparent 1px),linear-gradient(90deg,#efd9dc 1px,transparent 1px);background-size:18px 18px}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.seg{display:flex;background:#ecd3d7;border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 16px;font:inherit;font-size:14px;color:#7a4a52;font-weight:700}
.seg button.on{background:#b3263b;color:#fff}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.circ{width:38px;height:38px;border-radius:50%;border:2px solid #d9a9b0;background:#fff;color:#b3263b;font-size:20px;line-height:1;padding:0;flex:none}
.lbl{flex:1;text-align:left;border:0;background:none;font:inherit;color:#3a2326;padding:0 4px}
.lbl small{display:block;font-size:11px;color:#a07077;letter-spacing:.1em}
.lbl span{font-size:20px;font-weight:700}
.tbtn{border:2px solid #d9a9b0;background:#fff;color:#b3263b;border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;flex:none}
.stats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.pill{flex:none;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.p1{background:#b3263b;color:#fff;font-weight:700}
.p2{background:#d9707f;color:#fff;font-weight:700}
.p3{background:#fff;color:#5c3a40;border:1px solid #e8c6cb}
.notes{display:none;position:relative;background-color:#fff3d8;background-image:linear-gradient(#f2e3c0 1px,transparent 1px),linear-gradient(90deg,#f2e3c0 1px,transparent 1px);background-size:14px 14px;border-radius:8px;padding:16px 12px 10px;margin:16px 0 18px;box-shadow:0 2px 6px rgba(120,60,70,.15)}
.notes::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:110px;height:20px;background:repeating-linear-gradient(45deg,#e7a5af 0 6px,#f0c4cb 6px 12px);opacity:.85}
.nrow{display:flex;align-items:center;gap:10px;margin:4px 0}
.nchip{background:#b3263b;color:#fff;border-radius:6px;padding:6px 10px;font-weight:700;font-size:14px;flex:none}
.ntit{font-size:16px;font-weight:700}
.ndate{font-size:13px;color:#8a6a6e}
.clip{width:130px;height:34px;margin:14px auto -18px;position:relative;z-index:2;background:linear-gradient(#cfc4c6,#a89ca0);border-radius:10px 10px 6px 6px;box-shadow:0 3px 6px rgba(0,0,0,.2)}
.clip::after{content:"";position:absolute;left:50%;top:-12px;width:28px;height:28px;margin-left:-14px;border:5px solid #b9aeb1;border-radius:50%}
.panel{background:#ecd0d4;border-radius:22px;padding:26px 10px 12px}
.board{background:#fff;border-radius:14px;padding:6px 4px 10px;overflow:hidden}
.whead,.wbody{display:grid;grid-template-columns:22px repeat(7,1fr)}
.whead{border-bottom:2px solid #d9a9b0;padding-bottom:4px}
.hd{text-align:center;line-height:1.15}
.hd b{display:block;font-size:17px}
.hd i{display:block;font-style:normal;font-size:11px;color:#a07077}
.hd u{display:block;text-decoration:none;font-size:10px;color:#7a4a52}
.hd.istoday b{color:#b3263b}
.lab{position:relative}
.lab span{position:absolute;right:3px;font-size:10px;color:#8a6a6e}
.col{position:relative;border-left:1px dashed #e4c3c8;background-image:linear-gradient(#f0dde0 1px,transparent 1px);background-size:100% 30px}
.blk{position:absolute;left:1px;right:1px;border-radius:6px;background-color:#8c1c2e;background-size:cover;background-position:center;color:#fff;font-size:9px;line-height:1.2;overflow:hidden;padding:2px 3px;cursor:pointer;word-break:break-all}
.blk b{display:block;font-size:9px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.nm{text-align:center;font-size:12px;color:#a07077;padding:4px 0}
.cell{position:relative;aspect-ratio:1/1.3;border-radius:6px;background:#fbf3f4;overflow:hidden;cursor:pointer}
.cell.out{opacity:.4}
.cell.istoday{outline:2px solid #b3263b}
.stack{position:absolute;inset:0;display:flex;flex-direction:column}
.th{flex:1;min-height:0;background-size:cover;background-position:center;border-bottom:1px solid #fff}
.cell .n{position:absolute;right:4px;bottom:1px;font-weight:700;font-size:18px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.cell .n.plain{color:#d7b5ba;text-shadow:none}
.cell .hb{position:absolute;left:3px;top:2px;font-size:10px;background:rgba(58,35,38,.7);color:#fff;border-radius:6px;padding:0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.card{background-color:#fff8f2;background-image:linear-gradient(#f5e6e0 1px,transparent 1px),linear-gradient(90deg,#f5e6e0 1px,transparent 1px);background-size:16px 16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;border-radius:14px;padding:14px}
.card img{width:100%;border-radius:8px;margin:6px 0}
.card h2{font-size:16px;margin:6px 0 10px}
.card .x{float:right;border:0;border-radius:14px;padding:4px 10px;background:#e0b5bb;color:#3a2326;font:inherit}
.chip{display:inline-block;background:#b3263b;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px}
.row{display:flex;gap:8px;font-size:14px;margin:4px 0}
.row span:first-child{color:#a07077;width:44px;flex:none}
.go{display:block;text-align:center;background:#b3263b;color:#fff;border-radius:20px;padding:10px;text-decoration:none;margin-top:12px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ptop b{font-size:18px}
.ptop button{width:34px;height:34px;border-radius:50%;border:2px solid #d9a9b0;background:#fff;color:#b3263b;font-size:18px;padding:0}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mg button{border:1px solid #e0b5bb;background:#fff;border-radius:10px;padding:10px 0;font:inherit;font-size:14px;color:#3a2326;line-height:1.3}
.mg button small{display:block;color:#a07077;font-size:11px}
.mg button.cur{background:#b3263b;color:#fff;border-color:#b3263b}
.mg button.cur small{color:#fbd}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>ローレン・イロアス<br>방송 스케줄</h1>
<div class="seg"><button id="tw" class="on" onclick="setMode('week')">주</button><button id="tm" onclick="setMode('month')">월</button></div>
</div>
<div class="nav">
<button class="circ" onclick="move(-1)">‹</button>
<button class="lbl" onclick="openPicker()"><small id="yr"></small><span id="range"></span> ▾</button>
<button class="tbtn" onclick="goToday()">오늘</button>
<button class="circ" onclick="move(1)">›</button>
</div>
<div class="stats" id="stats"></div>
<div class="notes" id="notes"></div>
<div class="clip"></div>
<div class="panel"><div class="board" id="cal">불러오는 중...</div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeCard()"><div class="card" id="card"></div></div>
<script>
const H=30;
let events=[],notes=[],byDay={},seg={};
let mode="week";
let ref=new Date();ref.setHours(0,0,0,0);
const names=["월","화","수","목","금","토","일"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const hrs=l=>l.reduce((s,e)=>s+(e.hours||0),0);
const r1=x=>Math.round(x*10)/10;
const bg=u=>'url("'+String(u).replace(/["\\]/g,"")+'")';
const game=e=>((e.title.match(/【([^】]+)】/)||[])[1]||"기타");
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function build(){
 byDay={};seg={};
 events.forEach(e=>{
  const s=new Date(e.start);
  const en=e.end?new Date(e.end):new Date(s.getTime()+3600000);
  (byDay[key(s)]=byDay[key(s)]||[]).push(e);
  let d=new Date(s);d.setHours(0,0,0,0);
  while(d<en){
   const n=new Date(d);n.setDate(n.getDate()+1);
   const a=s>d?s:d,b=en<n?en:n;
   (seg[key(d)]=seg[key(d)]||[]).push({e:e,a:(a-d)/60000,b:(b-d)/60000,first:a.getTime()===s.getTime()});
   d=n;
  }
 });
}
function setMode(m){
 mode=m;
 document.getElementById("tw").className=m==="week"?"on":"";
 document.getElementById("tm").className=m==="month"?"on":"";
 draw();
}
function goToday(){ref=new Date();ref.setHours(0,0,0,0);draw();}
function move(n){
 if(mode==="week"){ref.setDate(ref.getDate()+7*n);}
 else{ref.setDate(1);ref.setMonth(ref.getMonth()+n);}
 draw();
}
function draw(){mode==="week"?drawWeek():drawMonth();}
function renderStats(list){
 const box=document.getElementById("stats");box.innerHTML="";
 const g={};
 list.forEach(e=>{const k=game(e);g[k]=(g[k]||0)+(e.hours||0);});
 const pill=(t,c)=>{const s=document.createElement("span");s.className="pill "+c;s.textContent=t;box.appendChild(s);};
 pill(list.length+" 회","p1");
 pill(r1(hrs(list))+" 시간","p2");
 Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(x=>pill(x[0]+" "+r1(x[1])+"h","p3"));
}
function drawNotes(){
 const box=document.getElementById("notes");box.innerHTML="";
 const now=new Date();
 const up=notes.map(n=>({t:n.title,d:new Date(n.date)})).filter(n=>n.d>=now).sort((a,b)=>a.d-b.d).slice(0,2);
 if(!up.length){box.style.display="none";return;}
 box.style.display="block";
 up.forEach(n=>{
  const row=document.createElement("div");row.className="nrow";
  const c=document.createElement("span");c.className="nchip";
  c.textContent="D-"+Math.ceil((n.d-now)/86400000);
  const w=document.createElement("div");
  const t=document.createElement("div");t.className="ntit";t.textContent=n.t;
  const dt=document.createElement("div");dt.className="ndate";
  dt.textContent=(n.d.getMonth()+1)+"/"+n.d.getDate()+" "+hm(n.d);
  w.appendChild(t);w.appendChild(dt);
  row.appendChild(c);row.appendChild(w);box.appendChild(row);
 });
}
function drawWeek(){
 const base=monday(ref);
 const days=[];
 for(let i=0;i<7;i++){const d=new Date(base);d.setDate(d.getDate()+i);days.push(d);}
 const list=[];
 days.forEach(d=>(byDay[key(d)]||[]).forEach(e=>list.push(e)));
 renderStats(list);
 const cal=document.getElementById("cal");cal.innerHTML="";
 const head=document.createElement("div");head.className="whead";
 head.appendChild(document.createElement("div"));
 const tk=key(new Date());
 days.forEach((d,i)=>{
  const c=document.createElement("div");
  c.className="hd"+(key(d)===tk?" istoday":"");
  const s=hrs(byDay[key(d)]||[]);
  c.innerHTML="<b>"+d.getDate()+"</b><i>"+names[i]+"</i><u>"+(s?r1(s)+"h":"&nbsp;")+"</u>";
  head.appendChild(c);
 });
 cal.appendChild(head);
 const body=document.createElement("div");body.className="wbody";
 const lab=document.createElement("div");lab.className="lab";lab.style.height=(24*H)+"px";
 for(let h=1;h<24;h++){const s=document.createElement("span");s.textContent=h;s.style.top=(h*H-7)+"px";lab.appendChild(s);}
 body.appendChild(lab);
 days.forEach(d=>{
  const col=document.createElement("div");col.className="col";col.style.height=(24*H)+"px";
  (seg[key(d)]||[]).forEach(sg=>{
   const e=sg.e;
   const b=document.createElement("div");b.className="blk";
   b.style.top=(sg.a/60*H)+"px";
   b.style.height=Math.max(16,(sg.b-sg.a)/60*H-1)+"px";
   if(e.thumb)b.style.backgroundImage="linear-gradient(rgba(70,20,30,.55),rgba(70,20,30,.65)),"+bg(e.thumb);
   if(sg.first){
    const tm=document.createElement("b");
    tm.textContent=hm(new Date(e.start))+(e.hours?" "+e.hours+"h":"");
    b.appendChild(tm);
   }
   b.appendChild(document.createTextNode(e.title));
   b.onclick=()=>openCard(e);
   col.appendChild(b);
  });
  body.appendChild(col);
 });
 cal.appendChild(body);
 const end=new Date(base);end.setDate(end.getDate()+6);
 document.getElementById("yr").textContent=base.getFullYear()+"년";
 document.getElementById("range").textContent=(base.getMonth()+1)+"/"+base.getDate()+" - "+(end.getMonth()+1)+"/"+end.getDate();
}
function drawMonth(){
 const y=ref.getFullYear(),m=ref.getMonth();
 const list=events.filter(e=>{const s=new Date(e.start);return s.getFullYear()===y&&s.getMonth()===m;});
 renderStats(list);
 const cal=document.getElementById("cal");cal.innerHTML="";
 const grid=document.createElement("div");grid.className="mgrid";
 names.forEach(n=>{const h=document.createElement("div");h.className="nm";h.textContent=n;grid.appendChild(h);});
 const d=monday(new Date(y,m,1));
 const last=new Date(y,m+1,0);
 const tk=key(new Date());
 while(d<=last||d.getDay()!==1){
  const l=byDay[key(d)]||[];
  const cell=document.createElement("div");
  cell.className="cell"+(d.getMonth()===m?"":" out")+(key(d)===tk?" istoday":"");
  const dd=new Date(d);
  cell.onclick=()=>{ref=dd;setMode("week");};
  if(l.length){
   const st=document.createElement("div");st.className="stack";
   l.slice(0,3).forEach(e=>{
    const t=document.createElement("div");t.className="th";
    if(e.thumb)t.style.backgroundImage=bg(e.thumb);
    st.appendChild(t);
   });
   cell.appendChild(st);
   const hb=document.createElement("span");hb.className="hb";hb.textContent=r1(hrs(l))+"h";
   cell.appendChild(hb);
  }
  const n=document.createElement("span");
  n.className="n"+(l.length?"":" plain");
  n.textContent=pad(d.getDate());
  cell.appendChild(n);
  grid.appendChild(cell);
  d.setDate(d.getDate()+1);
 }
 cal.appendChild(grid);
 document.getElementById("yr").textContent=y+"년";
 document.getElementById("range").textContent=(m+1)+"월";
}
function openCard(e){
 const card=document.getElementById("card");card.innerHTML="";
 const x=document.createElement("button");x.className="x";x.textContent="✕";x.onclick=closeCard;
 card.appendChild(x);
 const g=(e.title.match(/【([^】]+)】/)||[])[1];
 if(g){const c=document.createElement("span");c.className="chip";c.textContent=g;card.appendChild(c);}
 if(e.thumb){const im=document.createElement("img");im.src=e.thumb;im.alt="";card.appendChild(im);}
 const h=document.createElement("h2");h.textContent=e.title;card.appendChild(h);
 const st=new Date(e.start),en=e.end?new Date(e.end):null;
 const rows=[
  ["날짜",st.getFullYear()+"/"+(st.getMonth()+1)+"/"+st.getDate()+" ("+names[(st.getDay()+6)%7]+")"],
  ["시간",hm(st)+(en?" – "+hm(en):"")]
 ];
 if(e.hours)rows.push(["길이","약 "+e.hours+"시간"]);
 if(e.status==="upcoming")rows.push(["상태","방송 예정"]);
 if(e.status==="live")rows.push(["상태","방송 중"]);
 rows.forEach(r=>{
  const row=document.createElement("div");row.className="row";
  const a=document.createElement("span");a.textContent=r[0];
  const b=document.createElement("span");b.textContent=r[1];
  row.appendChild(a);row.appendChild(b);card.appendChild(row);
 });
 const go=document.createElement("a");
 go.className="go";go.href="https://www.youtube.com/watch?v="+e.id;
 go.target="_blank";go.rel="noopener";go.textContent="방송 열기 ↗";
 card.appendChild(go);
 document.getElementById("modal").classList.add("show");
}
function closeCard(){document.getElementById("modal").classList.remove("show");}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeCard();});
let pickY=0;
function openPicker(){pickY=ref.getFullYear();renderPicker();document.getElementById("modal").classList.add("show");}
function renderPicker(){
 const card=document.getElementById("card");card.innerHTML="";
 const top=document.createElement("div");top.className="ptop";
 const p=document.createElement("button");p.textContent="‹";p.onclick=()=>{pickY--;renderPicker();};
 const t=document.createElement("b");t.textContent=pickY+"년";
 const n=document.createElement("button");n.textContent="›";n.onclick=()=>{pickY++;renderPicker();};
 top.appendChild(p);top.appendChild(t);top.appendChild(n);card.appendChild(top);
 const g=document.createElement("div");g.className="mg";
 for(let m=0;m<12;m++){
  const sum=hrs(events.filter(e=>{const s=new Date(e.start);return s.getFullYear()===pickY&&s.getMonth()===m;}));
  const b=document.createElement("button");
  if(pickY===ref.getFullYear()&&m===ref.getMonth())b.className="cur";
  b.appendChild(document.createTextNode((m+1)+"월"));
  const sm=document.createElement("small");sm.textContent=sum?r1(sum)+"h":"–";
  b.appendChild(sm);
  b.onclick=()=>{ref=new Date(pickY,m,1);closeCard();setMode("month");};
  g.appendChild(b);
 }
 card.appendChild(g);
}
Promise.all([
 fetch("data.json?"+Date.now()).then(r=>r.json()),
 fetch("notes.json?"+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[])
]).then(r=>{events=r[0];notes=r[1];build();drawNotes();draw();})
 .catch(()=>{document.getElementById("cal").textContent="data.json을 불러오지 못했어요";});
</script>
</body>
</html>
